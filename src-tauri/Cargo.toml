[package]
name = "postcrate"
version = "0.1.0"
description = "Postcrate desktop app"
authors = ["Postcrate authors"]
edition = "2021"

[lib]
name = "postcrate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enables the codegen test that writes `src/lib/bindings.ts`. Off by
# default so normal cargo runs don't pay the type-export cost.
generate-bindings = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

postcrate-core = { path = "../../postcrate-core/crates/postcrate-core", features = ["specta"] }

specta = { version = "=2.0.0-rc.20", default-features = false, features = ["derive", "serde", "serde_json"] }
specta-typescript = "=0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }

tokio = { version = "1.41", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.6"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
