name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected Postcrate version: $VERSION"

      - id: check
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists. Nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist. Will build and release."
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      contents: write
    # macOS only for now. To add Windows/Linux later, append entries to
    # this matrix (and re-add the Linux apt-get step they need).
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater bundle signing. Generate the key with:
          #   pnpm tauri signer generate -w ~/.tauri/postcrate.key
          # Then add both as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check-version.outputs.tag }}
          releaseName: Postcrate ${{ needs.check-version.outputs.tag }}
          releaseBody: |
            Download the `.dmg` from the assets below, then drag Postcrate to your Applications folder.

            First launch: right-click → Open to bypass the unsigned-developer warning (until code-signing is set up).

            _Windows and Linux builds are not shipped yet._
          releaseDraft: true   # remains draft until publish-release flips it
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    name: Publish release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Flip draft -> published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.check-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false
